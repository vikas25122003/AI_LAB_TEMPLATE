<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Search Algorithms (A* & AO*)</title>
    <style>
        body { font-family: sans-serif; max-width: 1000px; margin: 0 auto; padding: 20px; background-color: #f4f4f9; }
        h1 { text-align: center; color: #333; }
        .container { display: flex; gap: 20px; }
        .panel { flex: 1; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        textarea { width: 100%; height: 150px; font-family: monospace; margin-bottom: 10px; border: 1px solid #ccc; border-radius: 4px; padding: 5px; }
        input { width: 100%; padding: 8px; margin-bottom: 10px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
        button { width: 100%; padding: 10px; background-color: #28a745; color: white; border: none; cursor: pointer; font-size: 16px; border-radius: 4px; }
        button:hover { background-color: #218838; }
        pre { background: #333; color: #fff; padding: 10px; border-radius: 5px; white-space: pre-wrap; min-height: 50px; }
        label { font-weight: bold; display: block; margin-top: 10px; margin-bottom: 5px; }
        .note { font-size: 0.85em; color: #666; margin-bottom: 10px; }
    </style>
</head>
<body>

    <h1>Search Algorithms</h1>

    <div class="container">
        <!-- A* Section -->
        <div class="panel">
            <h2>A* Algorithm</h2>
            <p class="note">Finds the shortest path from Start to Goal.</p>
            
            <label>Graph (JSON):</label>
            <textarea id="astar-graph">
{
    "rock_beach": [["white_town", 5], ["marina", 8]],
    "white_town": [["rock_beach", 5], ["auroville", 12], ["pims_curve", 7]],
    "auroville": [["white_town", 12], ["pondy_university", 4]],
    "marina": [["rock_beach", 8], ["chunnabar", 10]],
    "pims_curve": [["white_town", 7], ["pondy_university", 6]],
    "pondy_university": [["auroville", 4], ["pims_curve", 6], ["ptu", 3]],
    "chunnabar": [["marina", 10], ["serenity_beach", 15]],
    "ptu": [["pondy_university", 3]],
    "serenity_beach": [["chunnabar", 15]]
}
            </textarea>
            
            <label>Heuristics (JSON):</label>
            <textarea id="astar-heuristics">
{
    "rock_beach": 20, "white_town": 15, "auroville": 5,
    "marina": 18, "pims_curve": 8, "pondy_university": 2,
    "chunnabar": 25, "serenity_beach": 30, "ptu": 0
}
            </textarea>
            
            <label>Start Node:</label>
            <input type="text" id="astar-start" value="rock_beach">
            <label>Goal Node:</label>
            <input type="text" id="astar-goal" value="ptu">
            
            <button onclick="runAStar()">Run A*</button>
            
            <h3>Result:</h3>
            <pre id="astar-result">Waiting...</pre>
        </div>

        <!-- AO* Section -->
        <div class="panel">
            <h2>AO* Algorithm</h2>
            <p class="note">Finds optimal strategy in AND-OR graphs.</p>
            
            <label>AND-OR Graph (JSON):</label>
            <textarea id="aostar-graph">
{
    "survive": [
        [["loot_white_town", 2], ["hide_forest", 3]], 
        [["fight_rock_beach", 10]]
    ],
    "loot_white_town": [
        [["find_medkit", 1]], [["find_ammo", 2]]
    ],
    "hide_forest": [
        [["stay_quiet", 1]]
    ],
    "fight_rock_beach": [
        [["win_duel", 5]]
    ]
}
            </textarea>
            
            <label>Heuristics (JSON):</label>
            <textarea id="aostar-heuristics">
{
    "survive": 0, "loot_white_town": 0, "hide_forest": 0,
    "fight_rock_beach": 0, "find_medkit": 2, "find_ammo": 4,
    "stay_quiet": 1, "win_duel": 20
}
            </textarea>
            
            <label>Start Node:</label>
            <input type="text" id="aostar-start" value="survive">
            
            <button onclick="runAOStar()">Run AO*</button>
            
            <h3>Result:</h3>
            <pre id="aostar-result">Waiting...</pre>
        </div>
    </div>

    <script>
        async function runAStar() {
            const resultPre = document.getElementById('astar-result');
            resultPre.innerText = "Calculating...";
            
            try {
                const graph = JSON.parse(document.getElementById('astar-graph').value);
                const heuristics = JSON.parse(document.getElementById('astar-heuristics').value);
                const start = document.getElementById('astar-start').value;
                const goal = document.getElementById('astar-goal').value;

                const response = await fetch('/run_astar', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ graph, heuristics, start, goal })
                });
                const data = await response.json();
                
                if(data.status === 'success') {
                    resultPre.innerText = `✅ Optimal Path Found:\n${data.path.join(' -> ')}\n\nTotal Cost: ${data.cost}`;
                } else {
                    resultPre.innerText = `❌ Error: ${data.message}`;
                }
            } catch (e) {
                resultPre.innerText = "Invalid JSON or Network Error: " + e;
            }
        }

        async function runAOStar() {
            const resultPre = document.getElementById('aostar-result');
            resultPre.innerText = "Calculating...";
            
            try {
                const graph = JSON.parse(document.getElementById('aostar-graph').value);
                const heuristics = JSON.parse(document.getElementById('aostar-heuristics').value);
                const start = document.getElementById('aostar-start').value;

                const response = await fetch('/run_aostar', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ graph, heuristics, start })
                });
                const data = await response.json();
                
                if(data.status === 'success') {
                    resultPre.innerText = `✅ Minimum Cost: ${data.min_cost}\n\nStrategy Tree:\n${data.output}`;
                } else {
                    resultPre.innerText = `❌ Error: ${data.message}`;
                }
            } catch (e) {
                resultPre.innerText = "Invalid JSON or Network Error: " + e;
            }
        }
    </script>
</body>
</html>
