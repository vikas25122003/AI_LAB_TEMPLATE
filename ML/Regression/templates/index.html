<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Regression Prediction</title>
    <style>
        body { font-family: sans-serif; max-width: 800px; margin: 0 auto; padding: 20px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; }
        input { width: 100%; padding: 8px; }
        button { padding: 10px 20px; background-color: #28a745; color: white; border: none; cursor: pointer; }
        .result { margin-top: 20px; padding: 15px; background-color: #e9ecef; }
    </style>
</head>
<body>
    <h1>Price Prediction (Regression)</h1>
    
    <form method="POST" action="/">
        <!-- MODIFY THESE INPUTS TO MATCH YOUR DATASET -->
        <div class="form-group">
            <label>Feature 1 (Numeric):</label>
            <input type="number" step="any" name="feature_1" required>
        </div>
        <div class="form-group">
            <label>Feature 2 (Numeric):</label>
            <input type="number" step="any" name="feature_2" required>
        </div>
        <div class="form-group">
            <label>Feature 3 (Numeric):</label>
            <input type="number" step="any" name="feature_3" required>
        </div>
        <div class="form-group">
            <label>Location (Urban, Suburban, Rural):</label>
            <input type="text" name="location" required>
        </div>

        <button type="submit">Predict Price</button>
    </form>

    {% if prediction is not none %}
    <div class="result">
        <h2>{{ prediction }}</h2>
    </div>
    {% endif %}
</body>
</html>
