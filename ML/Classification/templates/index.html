<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ML Classification Demo</title>
    <style>
        body { font-family: sans-serif; max-width: 800px; margin: 0 auto; padding: 20px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; }
        input { width: 100%; padding: 8px; box-sizing: border-box; }
        button { padding: 10px 20px; background-color: #007bff; color: white; border: none; cursor: pointer; }
        button:hover { background-color: #0056b3; }
        .result { margin-top: 20px; padding: 15px; background-color: #f0f0f0; border-radius: 5px; }
    </style>
</head>
<body>
    <h1>Classification Prediction</h1>
    
    <form method="POST" action="/">
        <!-- Adjust these inputs based on your generate_dataset.py NUM_FEATURES -->
        <div class="form-group">
            <label for="feature_1">Feature 1:</label>
            <input type="number" step="any" name="feature_1" required>
        </div>
        <div class="form-group">
            <label for="feature_2">Feature 2:</label>
            <input type="number" step="any" name="feature_2" required>
        </div>
        <div class="form-group">
            <label for="feature_3">Feature 3:</label>
            <input type="number" step="any" name="feature_3" required>
        </div>
        <div class="form-group">
            <label for="feature_4">Feature 4:</label>
            <input type="number" step="any" name="feature_4" required>
        </div>
        <div class="form-group">
            <label for="feature_cat">Feature Cat (A, B, or C):</label>
            <input type="text" name="feature_cat" required>
        </div>

        <button type="submit">Predict</button>
    </form>

    {% if prediction is not none %}
    <div class="result">
        <h2>Result</h2>
        <p><strong>Prediction:</strong> {{ prediction }}</p>
    </div>
    {% endif %}
</body>
</html>
